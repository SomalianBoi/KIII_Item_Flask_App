name: Build and Push Docker Image

on:
  push:
    branches:
      - MAIN  # Runs only when you push to the 'main' branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kiii-web:latest .

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kiii-web:latest

      - name: Send Discord notification on success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\": \"GitHub Actions\", \"content\": \"✅ Build & push succeeded for **${{ github.repository }}** on branch **${{ github.ref_name }}**.\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord notification on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\": \"GitHub Actions\", \"content\": \"❌ Build & push failed for **${{ github.repository }}** on branch **${{ github.ref_name }}**. Check logs for details.\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
