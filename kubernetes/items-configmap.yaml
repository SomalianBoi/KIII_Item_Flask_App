apiVersion: v1
kind: ConfigMap
metadata:
  name: flaskapp-configmap
  namespace: flaskapp
data:
  FLASK_APP: app.py
  FLASK_RUN_HOST: 0.0.0.0
  FLASK_RUN_PORT: "5000"
  FLASK_ENV: development
  FLASK_DEBUG: "1"
  MONGO_URI: "mongodb://flaskapp-db-0.flaskapp-db-headless.flaskapp.svc.cluster.local:27017,flaskapp-db-1.flaskapp-db-headless.flaskapp.svc.cluster.local:27017,flaskapp-db-2.flaskapp-db-headless.flaskapp.svc.cluster.local:27017/flaskapp-db?replicaSet=rs0"
