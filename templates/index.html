<!DOCTYPE html>
<html>
<head>
    <title>Items</title>
</head>
<body>
    <h1>Item List</h1>
    <form action="/add" method="post">
        <input type="text" name="name" placeholder="Item name" required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for item in items %}
            <li>
                {{ item.name }}
                <a href="{{ url_for('edit_item', id=item._id) }}">Edit</a>
                <a href="{{ url_for('delete_item', id=item._id) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
